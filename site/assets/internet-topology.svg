<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ mạng gia đình kết nối Internet</title>
  <desc id="desc">Laptop và điện thoại trong mạng riêng 192.168.1.0/24 nối qua Wi-Fi hoặc switch đến router NAT, qua ONT và ISP ra Internet. DNS, web server và mạng riêng văn phòng nằm ở phía bên kia.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17324d} .small{font-size:16px} .tiny{font-size:14px} .label{font-size:20px;font-weight:700} .ip{font-size:17px;font-weight:700;fill:#174f86} .zone{font-size:23px;font-weight:700} .box{fill:#fff;stroke:#b7d1e9;stroke-width:2} .link{fill:none;stroke:#417bb3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round} .dash{stroke-dasharray:8 7}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#417bb3"/></marker>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#f8fbff"/>
  <rect x="22" y="24" width="370" height="580" rx="22" fill="#eaf7f2" stroke="#93cdb5" stroke-width="2"/>
  <text x="48" y="61" class="zone">Mạng riêng gia đình</text>
  <text x="48" y="89" class="ip">192.168.1.0/24</text>
  <rect x="45" y="135" width="150" height="93" rx="15" class="box"/>
  <text x="63" y="168" class="label">Laptop</text><text x="63" y="198" class="ip">192.168.1.10</text>
  <rect x="45" y="290" width="150" height="93" rx="15" class="box"/>
  <text x="63" y="323" class="label">Điện thoại</text><text x="63" y="353" class="ip">192.168.1.11</text>
  <rect x="226" y="207" width="140" height="110" rx="15" class="box"/>
  <text x="249" y="242" class="label">AP / switch</text><text x="248" y="272" class="small">Nối thiết bị</text><text x="248" y="294" class="small">trong LAN</text>
  <path d="M195 182 H212 V248 H226 M195 337 H212 V277 H226" class="link"/>
  <rect x="69" y="439" width="290" height="118" rx="16" fill="#d6eafa" stroke="#7db4df" stroke-width="2"/>
  <text x="90" y="476" class="label">Router + NAT + DHCP</text>
  <text x="90" y="506" class="small">Cổng LAN: 192.168.1.1</text>
  <text x="90" y="535" class="ip">Cổng WAN: 203.0.113.10</text>
  <path d="M296 317 V420 H214 V439" class="link" marker-end="url(#arrow)"/>
  <rect x="427" y="439" width="155" height="118" rx="16" class="box"/>
  <text x="450" y="477" class="label">Modem / ONT</text>
  <text x="449" y="506" class="small">Đầu cuối đường</text><text x="449" y="529" class="small">truy nhập ISP</text>
  <path d="M359 498 H427" class="link" marker-end="url(#arrow)"/>
  <rect x="617" y="439" width="140" height="118" rx="16" fill="#e8efff" stroke="#9cb5e7" stroke-width="2"/>
  <text x="655" y="478" class="label">ISP</text><text x="637" y="506" class="small">Mạng nhà</text><text x="637" y="529" class="small">cung cấp</text>
  <path d="M582 498 H617" class="link" marker-end="url(#arrow)"/>
  <rect x="803" y="420" width="155" height="137" rx="60" fill="#dfedff" stroke="#80ace1" stroke-width="2"/>
  <text x="830" y="477" class="zone">Internet</text><text x="831" y="509" class="small">Mạng của</text><text x="831" y="532" class="small">các mạng</text>
  <path d="M757 498 H803" class="link" marker-end="url(#arrow)"/>
  <rect x="980" y="68" width="191" height="111" rx="16" class="box"/>
  <text x="1000" y="105" class="label">DNS resolver</text><text x="1000" y="138" class="ip">198.51.100.53</text>
  <rect x="980" y="237" width="191" height="111" rx="16" class="box"/>
  <text x="1000" y="274" class="label">Web server</text><text x="1000" y="307" class="ip">198.51.100.20</text>
  <rect x="979" y="410" width="196" height="179" rx="20" fill="#fff3e0" stroke="#e2b56c" stroke-width="2"/>
  <text x="998" y="446" class="label">Mạng văn phòng</text>
  <text x="998" y="479" class="ip">10.0.2.0/24</text>
  <text x="998" y="514" class="small">Router ngoài:</text><text x="998" y="539" class="ip">192.0.2.20</text>
  <text x="998" y="568" class="small">Máy: 10.0.2.15</text>
  <path d="M880 420 V123 H980 M880 292 H980 M958 498 H979" class="link dash" marker-end="url(#arrow)"/>
  <text x="613" y="389" class="tiny">Lưu lượng đi qua các router trên Internet</text>
  <text x="48" y="591" class="tiny">IP riêng chỉ dùng trong mạng nội bộ; router NAT đổi địa chỉ nguồn khi ra ngoài.</text>
</svg>
